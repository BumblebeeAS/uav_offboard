/**/offboard_node:
  ros__parameters:
    offboard_control_mode_topic: /fmu/in/offboard_control_mode
    trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
    goal_pose_topic: /uav/goal_pose
    goal_pose_frame: odom_ned
    vehicle_command_topic: /fmu/in/vehicle_command
    vehicle_local_position_topic: /fmu/out/vehicle_local_position_v1
    # Match the mission planner's home_ned controls frame.
    use_home_position: true
    # Match the topic exposed by your firmware (some versions omit _v1).
    home_position_topic: /fmu/out/home_position_v1
    vehicle_status_topic: /fmu/out/vehicle_status_v1
    acceleration_control_topic: /uav/acceleration_control
    spiral_geofence_margin: 1.0
    spiral_geofence_max_age: 5.0

/**/home_odometry_node:
  ros__parameters:
    odom_topic: odom_ned
    output_topic: odom_home_ned
    home_position_topic: /fmu/out/home_position_v1
    local_frame: odom_ned
    home_frame: home_ned

/**/landing_target_pose_node:
  ros__parameters:
    target_pose_topic: /uav/wide_a/asv/pose
    max_pose_age: 0.3
    landing_target_pose_topic: /fmu/in/landing_target_pose
    vehicle_status_topic: /fmu/out/vehicle_status_v1

/**/actuator_control_node:
  ros__parameters:
    actuation_server_name: /uav/tins/actuation
    px4_address: udpin://0.0.0.0:14540
    timeout: 5.0
    actuation_indexes: [1, 2]
    publish_rc_kill: true
    rc_switches_topic: /uav/rc/manual_control_switches
    publish_geofence: true
    geofence_topic: geofence
    geofence_refresh_interval: 1.0
    geofence_download_timeout: 15.0
